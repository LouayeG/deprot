[workspace]
resolver = "2"
members = [
    "crates/deprot-core",
    "crates/deprot-manifest",
    "crates/deprot-collect",
    "crates/deprot-report",
    "crates/deprot-policy",
    "crates/deprot-tui",
    "crates/deprot-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LouayeG/deprot"
authors = ["LouayeG"]
rust-version = "1.75"

[workspace.dependencies]
# internal
deprot-core = { path = "crates/deprot-core" }
deprot-manifest = { path = "crates/deprot-manifest" }
deprot-collect = { path = "crates/deprot-collect" }
deprot-report = { path = "crates/deprot-report" }
deprot-policy = { path = "crates/deprot-policy" }
deprot-tui = { path = "crates/deprot-tui" }
# external
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
comfy-table = "7"
directories = "5"
semver = "1"
toml = "0.8"
ratatui = "0.29"

[profile.release]
lto = "thin"
strip = true
