[workspace]
resolver = "2"
members = [
    "crates/deprot-core",
    "crates/deprot-secrets",
    "crates/deprot-actions",
    "crates/deprot-hygiene",
    "crates/deprot-reach",
    "crates/deprot-malware",
    "crates/deprot-netmon",
    "crates/deprot-manifest",
    "crates/deprot-collect",
    "crates/deprot-report",
    "crates/deprot-policy",
    "crates/deprot-tui",
    "crates/deprot-cli",
]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LouayeG/deprot"
homepage = "https://github.com/LouayeG/deprot"
authors = ["LouayeG"]
rust-version = "1.75"
keywords = ["dependencies", "security", "supply-chain", "audit", "sbom"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# internal (path + version so each crate is publishable to crates.io)
deprot-core = { path = "crates/deprot-core", version = "0.7.0" }
deprot-secrets = { path = "crates/deprot-secrets", version = "0.7.0" }
deprot-actions = { path = "crates/deprot-actions", version = "0.7.0" }
deprot-hygiene = { path = "crates/deprot-hygiene", version = "0.7.0" }
deprot-reach = { path = "crates/deprot-reach", version = "0.7.0" }
deprot-malware = { path = "crates/deprot-malware", version = "0.7.0" }
deprot-netmon = { path = "crates/deprot-netmon", version = "0.7.0" }
deprot-manifest = { path = "crates/deprot-manifest", version = "0.7.0" }
deprot-collect = { path = "crates/deprot-collect", version = "0.7.0" }
deprot-report = { path = "crates/deprot-report", version = "0.7.0" }
deprot-policy = { path = "crates/deprot-policy", version = "0.7.0" }
deprot-tui = { path = "crates/deprot-tui", version = "0.7.0" }
# external
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
comfy-table = "7"
directories = "5"
semver = "1"
toml = "0.8"
ratatui = "0.29"
regex = "1"

[profile.release]
lto = "thin"
strip = true
